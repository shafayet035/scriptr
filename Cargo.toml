# Two crates: the desktop app, and the stdio MCP bridge an outside agent talks to.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/scriptr-mcp"]

# Profiles only take effect at the workspace root; Cargo ignores a member's own.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
